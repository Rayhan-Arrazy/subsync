version: "3.8"
services:
  db:
    image: mysql:8.0
    container_name: subsync-mysql
    restart: always
    environment:
      MYSQL_DATABASE: subsync
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data_final:/var/lib/mysql

volumes:
  mysql_data_final:
