<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubSync | Manager</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="background-blur"></div>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-layer-group"></i>
                <h1>SubSync</h1>
            </div>
            <div class="user-select-container">
                <label>Acting As:</label>
                <select id="currentUserSelect" onchange="loadLedger()">
                </select>
            </div>
        </header>

        <main>
            <section class="add-sub-section">
                <h3><i class="fa-solid fa-plus-circle"></i> New Subscription</h3>
                <form id="sub-form">
                    <input type="hidden" id="edit-sub-id">
                    <div class="input-group">
                        <label>Service Name</label>
                        <input type="text" id="name" placeholder="e.g. Netflix" required>
                    </div>

                    <div class="input-group">
                        <label>Monthly Cost</label>
                        <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                    </div>

                    <div class="input-group">
                        <label>Shared With (Consumers)</label>
                        <div id="consumer-checkboxes" class="checkbox-grid">
                        </div>
                    </div>

                    <button type="submit" id="save-btn">
                        Save Subscription
                    </button>
                    <button type="button" id="cancel-btn" style="display:none; background:#ef4444; margin-top:10px;">
                        Cancel Edit
                    </button>
                </form>
            </section>

            <section class="list-section">

                <h3>Active Subscriptions</h3>
                <div id="sub-list" class="grid-container"></div>

                <hr style="margin: 30px 0; border-color: rgba(255,255,255,0.1);">

                <h3><i class="fa-solid fa-file-invoice-dollar"></i> My Ledger</h3>
                <div id="ledger-list" class="ledger-container">
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
