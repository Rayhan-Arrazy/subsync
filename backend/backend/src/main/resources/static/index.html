<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubSync - Dashboard</title>
    <style>
        :root {
            --bg-dark: #0f1020;
            /* Deep dark blue/black */
            --bg-card: #1c1d30;
            /* Slightly lighter for cards */
            --primary: #6366f1;
            /* Purple/Indigo */
            --primary-hover: #4f46e5;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Navbar --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background-color: transparent;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-main);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: none;
            border: 1px solid var(--text-muted);
            padding: 5px 10px;
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        /* --- Main Layout --- */
        .container {
            flex: 1;
            display: grid;
            grid-template-columns: 350px 1fr;
            /* Fixed sidebar, flexible content */
            gap: 40px;
            padding: 2rem 5%;
        }

        /* --- Left Column: Form --- */
        .add-card {
            background-color: var(--bg-card);
            padding: 2rem;
            border-radius: 20px;
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: sticky;
            top: 20px;
        }

        .add-card h3 {
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #333;
            background-color: #0b0c15;
            color: white;
            font-size: 1rem;
        }

        .form-control:focus {
            outline: 2px solid var(--primary);
            border-color: transparent;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: var(--primary);
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        /* --- Right Column: Grid of Subs --- */
        .subs-section h2 {
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        .subs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .sub-item {
            background-color: var(--bg-card);
            padding: 1.5rem;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
            border: 1px solid transparent;
        }

        .sub-item:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 10px;
        }

        .service-name {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .sub-cost {
            font-size: 1.5rem;
            color: var(--primary);
            font-weight: bold;
            margin: 10px 0;
        }

        .sub-cost span {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: normal;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-sm {
            padding: 5px 10px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-delete {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--danger);
        }

        .btn-delete:hover {
            background-color: var(--danger);
            color: white;
        }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            /* Stack vertically */
            .add-card {
                position: static;
                order: -1;
            }

            /* Form stays on top */
            .nav-links {
                display: none;
            }

            /* Hide menu on small screens for now */
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                <path
                    d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z" />
            </svg>
            SubSync
        </div>
        <div class="nav-links">
            <a href="#" class="active">Dashboard</a>
            <a href="#">Analytics</a>
            <a href="#">Settings</a>
        </div>
        <div class="user-profile">
            <span>Hello, Bob</span>
            <button class="logout-btn">⏻</button>
        </div>
    </nav>

    <div class="container">
        <div class="add-card">
            <h3>+ New Subscription</h3>
            <form id="subForm">
                <div class="form-group">
                    <label>Service Name</label>
                    <input type="text" id="serviceName" class="form-control" placeholder="e.g. Netflix" required>
                </div>
                <div class="form-group">
                    <label>Monthly Cost ($)</label>
                    <input type="number" id="monthlyCost" class="form-control" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label>Description (Optional)</label>
                    <input type="text" id="description" class="form-control" placeholder="Standard Plan">
                </div>
                <button type="submit" class="btn-primary">Track Subscription</button>
            </form>
        </div>

        <div class="subs-section">
            <h2>Active Subscriptions</h2>
            <div id="subsGrid" class="subs-grid">
                <p style="color: gray;">Loading subscriptions...</p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api/subscriptions'; // Make sure your Controller matches this

        // 1. Fetch and Display Subscriptions
        async function loadSubscriptions() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) throw new Error("Failed to fetch");
                const data = await res.json();

                const grid = document.getElementById('subsGrid');
                grid.innerHTML = ''; // Clear loading text

                if (data.length === 0) {
                    grid.innerHTML = '<p style="color: gray;">No subscriptions yet. Add one!</p>';
                    return;
                }

                data.forEach(sub => {
                    const card = document.createElement('div');
                    card.className = 'sub-item';
                    card.innerHTML = `
                        <div>
                            <div class="sub-header">
                                <span class="service-name">${sub.serviceName}</span>
                            </div>
                            <div class="sub-cost">$${sub.monthlyCost}<span>/mo</span></div>
                            <small style="color:gray">${sub.description || ''}</small>
                        </div>
                        <div class="actions">
                            <button class="btn-sm btn-delete" onclick="deleteSub('${sub.id}')">Remove</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // 2. Handle Form Submit
        document.getElementById('subForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newSub = {
                serviceName: document.getElementById('serviceName').value,
                monthlyCost: parseFloat(document.getElementById('monthlyCost').value),
                description: document.getElementById('description').value
            };

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newSub)
                });

                if (res.ok) {
                    document.getElementById('subForm').reset();
                    loadSubscriptions(); // Refresh list
                } else {
                    alert("Error saving subscription");
                }
            } catch (err) {
                console.error(err);
            }
        });

        // 3. Handle Delete
        async function deleteSub(id) {
            if (!confirm("Stop tracking this subscription?")) return;

            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadSubscriptions();
        }

        // Initial Load
        loadSubscriptions();
    </script>
</body>

</html>
